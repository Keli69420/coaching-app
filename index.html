<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pathletics</title>
  <meta name="description" content="Today's workout from your coach's plan. Log what you did and see how far you've come.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050506">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pathletics">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-180.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- The fade under the trend line. -->
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g-fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
    </defs>
  </svg>
  <div class="app">
    <section class="sheet">
      <header class="top">
        <h1>Pathletics</h1>
        <span class="chipslot" id="chip"></span>
      </header>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="ladder" id="ladder" aria-label="Progress"></div>
    </section>
    <main id="main"></main>
  </div>
  <nav class="pages" id="pages" aria-label="Pages" hidden>
    <button type="button" data-page="training" aria-current="page">Workout</button>
    <button type="button" data-page="progress">Progress</button>
  </nav>
  <noscript><p>This page needs JavaScript.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
